version: "3.9"

services:
  # PostgreSQL with pgvector for vector storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-rag-postgres
    environment:
      POSTGRES_DB: agentic-rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
  # RAG API Service
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agentic-rag-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=admin
      - DATABASE_NAME=agentic-rag
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - DIM=768
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Data Ingestion Pipeline
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: agentic-rag-ingestion
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=admin
      - DATABASE_NAME=agentic-rag
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - DIM=768
      - EXTRACTOR=docling
      - EXPORT_FORMAT=markdown
      - SOURCE_DATA_PATH=data
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./main.py:/app/main.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - ingestion
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenWebUI for chat interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: agentic-rag-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_BASE_URL=http://rag-api:8000
      - OPENAI_API_KEY=dummy-key
      - WEBUI_SECRET_KEY=your-secret-key-here
      - ENABLE_RAG_HYBRID_SEARCH=true
      - DEFAULT_MODELS=agentic-rag
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - rag-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Arize Phoenix for observability and tracing
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: agentic-rag-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    environment:
      - PHOENIX_SQL_DATABASE_URL=sqlite:////tmp/phoenix.db
      - PHOENIX_WORKING_DIR=/tmp
    volumes:
      - phoenix_data:/tmp
    restart: unless-stopped

  # RAGAS Evaluation Service
  evaluation:
    build:
      context: .
      dockerfile: Dockerfile.evaluation
    container_name: agentic-rag-evaluation
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=admin
      - DATABASE_NAME=agentic-rag
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG_API_BASE_URL=http://rag-api:8000
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - PHOENIX_PROJECT_NAME=ragas-evaluation
      - SOURCE_DATA_PATH=data
      - EVALUATION_DATASET=${EVALUATION_DATASET:-small_dataset.jsonl}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./evaluate.py:/app/evaluate.py
      - ./evaluation_results:/app/evaluation_results
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_started
      phoenix:
        condition: service_started
    restart: "no"
    profiles:
      - evaluation
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
  open_webui_data:
    driver: local
  phoenix_data:
    driver: local
